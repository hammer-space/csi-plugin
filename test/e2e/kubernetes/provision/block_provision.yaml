# Raw block volume provisioning and pod attachment E2E test.
#
# Run:
#   kubectl apply -f test/e2e/kubernetes/provision/block_provision.yaml
#   kubectl -n hs-block-provision-e2e wait --for=jsonpath='{.status.phase}'=Bound pvc/data --timeout=5m
#   kubectl -n hs-block-provision-e2e wait --for=jsonpath='{.status.phase}'=Succeeded pod/block-provision-check --timeout=5m
#   kubectl -n hs-block-provision-e2e logs pod/block-provision-check
#
# To rerun after a driver change:
#   kubectl -n hs-block-provision-e2e delete pod block-provision-check --ignore-not-found
#   kubectl -n hs-block-provision-e2e delete pvc data --ignore-not-found
#   kubectl apply -f test/e2e/kubernetes/provision/block_provision.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: hs-block-provision-e2e
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hs-block-provision-e2e
provisioner: com.hammerspace.csi
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  blockBackingShareName: k8s-block-storage
  objectives: "keep-online"
  deleteDelay: "0"
  volumeNameFormat: "csi-block-provision-%s"
  additionalMetadataTags: "storageClassName=hs-block-provision-e2e,fsType=block"
  comment: "Raw block volume provisioning E2E volume"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: hs-block-provision-e2e
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Block
  storageClassName: hs-block-provision-e2e
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: block-provision-check
  namespace: hs-block-provision-e2e
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          set -eu
          marker="block-provision-ok"
          printf "%s" "${marker}" > /tmp/marker.txt
          dd if=/tmp/marker.txt of=/dev/hsblock bs=512 count=1 conv=notrunc
          sync
          actual="$(dd if=/dev/hsblock bs=512 count=1 2>/dev/null | tr -d '\000')"
          echo "${actual}"
          test "${actual}" = "${marker}"
          echo "PASS: raw block PVC provisioned, attached, and persisted marker"
      volumeDevices:
        - name: data
          devicePath: /dev/hsblock
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data
