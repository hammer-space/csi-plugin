# NFS mountBackingShareName volume provisioning and pod attachment E2E test.
#
# This scenario provisions an NFS directory under a shared backing export using
# mountBackingShareName.
#
# Run:
#   kubectl apply -f test/e2e/kubernetes/provision/nfs_mount_backing_provision.yaml
#   kubectl -n hs-nfs-mount-backing-provision-e2e wait --for=jsonpath='{.status.phase}'=Bound pvc/data --timeout=5m
#   kubectl -n hs-nfs-mount-backing-provision-e2e wait --for=jsonpath='{.status.phase}'=Succeeded pod/nfs-mount-backing-provision-check --timeout=5m
#   kubectl -n hs-nfs-mount-backing-provision-e2e logs pod/nfs-mount-backing-provision-check
#
# To rerun after a driver change:
#   kubectl -n hs-nfs-mount-backing-provision-e2e delete pod nfs-mount-backing-provision-check --ignore-not-found
#   kubectl -n hs-nfs-mount-backing-provision-e2e delete pvc data --ignore-not-found
#   kubectl apply -f test/e2e/kubernetes/provision/nfs_mount_backing_provision.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: hs-nfs-mount-backing-provision-e2e
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hs-nfs-mount-backing-provision-e2e
provisioner: com.hammerspace.csi
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - vers=4.2
  - hard
  - timeo=600
parameters:
  fsType: "nfs"
  mountBackingShareName: k8s-nfs-storage
  objectives: "keep-online"
  exportOptions: "*,RW,false"
  deleteDelay: "0"
  volumeNameFormat: "csi-nfs-dir-provision-%s"
  additionalMetadataTags: "storageClassName=hs-nfs-mount-backing-provision-e2e,fsType=nfs"
  comment: "NFS mountBackingShareName volume provisioning E2E volume"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: hs-nfs-mount-backing-provision-e2e
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: hs-nfs-mount-backing-provision-e2e
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: nfs-mount-backing-provision-check
  namespace: hs-nfs-mount-backing-provision-e2e
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          set -eu
          marker="nfs-mount-backing-provision-ok"
          echo "${marker}" > /data/marker.txt
          sync
          actual="$(cat /data/marker.txt)"
          echo "${actual}"
          test "${actual}" = "${marker}"
          echo "PASS: NFS mountBackingShareName PVC provisioned, attached, and persisted marker"
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data
