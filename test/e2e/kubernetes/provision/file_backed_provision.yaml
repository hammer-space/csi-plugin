# File-backed filesystem volume provisioning and pod attachment E2E test.
#
# Run:
#   kubectl apply -f test/e2e/kubernetes/provision/file_backed_provision.yaml
#   kubectl -n hs-file-provision-e2e wait --for=jsonpath='{.status.phase}'=Bound pvc/data --timeout=5m
#   kubectl -n hs-file-provision-e2e wait --for=jsonpath='{.status.phase}'=Succeeded pod/file-provision-check --timeout=5m
#   kubectl -n hs-file-provision-e2e logs pod/file-provision-check
#
# To rerun after a driver change:
#   kubectl -n hs-file-provision-e2e delete pod file-provision-check --ignore-not-found
#   kubectl -n hs-file-provision-e2e delete pvc data --ignore-not-found
#   kubectl apply -f test/e2e/kubernetes/provision/file_backed_provision.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: hs-file-provision-e2e
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hs-file-provision-e2e
provisioner: com.hammerspace.csi
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - vers=4.2
  - hard
  - timeo=600
parameters:
  fsType: "ext4"
  mountBackingShareName: k8s-file-storage
  objectives: "keep-online"
  deleteDelay: "0"
  volumeNameFormat: "csi-file-provision-%s"
  additionalMetadataTags: "storageClassName=hs-file-provision-e2e,fsType=ext4"
  comment: "File-backed volume provisioning E2E volume"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: hs-file-provision-e2e
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hs-file-provision-e2e
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: file-provision-check
  namespace: hs-file-provision-e2e
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          set -eu
          marker="file-provision-ok"
          echo "${marker}" > /data/marker.txt
          sync
          actual="$(cat /data/marker.txt)"
          echo "${actual}"
          test "${actual}" = "${marker}"
          echo "PASS: file-backed PVC provisioned, attached, and persisted marker"
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data
