# Example VolumeSnapshotClass for the Hammerspace CSI Plugin.
#
# Requires the external-snapshotter CRDs and controller to be installed in the
# cluster; the csi-snapshotter sidecar in plugin.yaml speaks the v1 API.
#
# The driver takes no VolumeSnapshotClass parameters — snapshot behavior is
# derived from the source volume (share-backed volumes get a share snapshot,
# file-backed volumes get a file snapshot), so no `parameters:` block is needed.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: hs-snapshots
driver: com.hammerspace.csi
# Delete - the Hammerspace snapshot is removed when the VolumeSnapshot is deleted.
# Retain - the VolumeSnapshotContent and the Hammerspace snapshot are kept.
deletionPolicy: Delete
