# =============================================================================
#  Hammerspace CSI driver — Anvil admin credentials  (TEMPLATE — DO NOT COMMIT)
# =============================================================================
#  This file is a TEMPLATE. Replace every <PLACEHOLDER> with your real values,
#  then apply it. DO NOT commit the filled-in copy to version control.
#
#  A Kubernetes Secret is only base64-encoded, NOT encrypted. Anyone who can read
#  the manifest can recover the credential. See deploy/kubernetes/SECRETS.md for
#  the recommended approaches.
#
#  PREFERRED — create the Secret imperatively so the value never lands in a file
#  you might accidentally commit:
#
#    kubectl create secret generic com.hammerspace.csi.credentials \
#      --namespace kube-system \
#      --from-literal=username='<PLACEHOLDER>' \
#      --from-literal=password='<PLACEHOLDER>' \
#      --from-literal=endpoint='https://<PLACEHOLDER>'
#
#  GITOPS-SAFE / PRODUCTION — do not store plaintext creds in git at all; use
#  Sealed Secrets, the External Secrets Operator, or the Secrets Store CSI Driver.
#  See deploy/kubernetes/SECRETS.md for a worked SealedSecret example, a
#  comparison of the three approaches, and how to scope RBAC to this one Secret.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: com.hammerspace.csi.credentials
  namespace: kube-system
type: Opaque
# An immutable Secret cannot be changed in place: this prevents accidental edits
# and reduces API-server/kubelet watch load. To rotate credentials, delete and
# recreate the Secret (then restart the driver pods, since the values are injected
# as environment variables at pod start). Remove this line if you prefer to rotate
# by patching the Secret in place.
immutable: true
# stringData accepts plain UTF-8 — Kubernetes base64-encodes it for you on apply —
# so there is no encoded blob here to be mistaken for encryption. The keys
# (username/password/endpoint) are the ones the driver pods read via secretKeyRef.
stringData:
  username: "<PLACEHOLDER>"
  password: "<PLACEHOLDER>"
  endpoint: "https://<PLACEHOLDER>"
