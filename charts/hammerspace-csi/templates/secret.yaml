{{- include "hammerspace-csi.validateSecret" . -}}
{{- if .Values.hammerspace.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hammerspace-csi.secretName" . }}
  namespace: {{ include "hammerspace-csi.namespace" . }}
  labels:
    {{- include "hammerspace-csi.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.hammerspace.secret.username | quote }}
  password: {{ .Values.hammerspace.secret.password | quote }}
  endpoint: {{ .Values.hammerspace.endpoint | quote }}
{{- end }}
