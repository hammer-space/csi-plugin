{{- if .Values.rbac.create }}
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-node
  namespace: {{ include "hammerspace-csi.namespace" . }}
  labels:
    {{- include "hammerspace-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  # Least-privilege: the node driver's credentials are injected by the kubelet via
  # secretKeyRef (no ServiceAccount RBAC needed). Scoped to only the named
  # credential Secret (get, not cluster-wide list). See deploy/kubernetes/SECRETS.md.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "hammerspace-csi.secretName" . | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "update"]
  - apiGroups: [""]
    resources: ["namespaces", "events"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["persistentvolumes", "persistentvolumeclaims", "persistentvolumeclaims/status","events"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments", "volumeattachments/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-node
  namespace: {{ include "hammerspace-csi.namespace" . }}
  labels:
    {{- include "hammerspace-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.nodeName }}
    namespace: {{ include "hammerspace-csi.namespace" . }}
roleRef:
  kind: ClusterRole
  name: csi-node
  apiGroup: rbac.authorization.k8s.io
{{- end }}
