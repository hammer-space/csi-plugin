#   deploy/kubernetes/kubernetes-1.36/plugin.yaml (the shipped Kubernetes 1.36
#   manifest, v1.3.0). It is intentionally NOT generated from the chart's own
#   render — that would be circular. tests/golden/run.sh renders the chart with
#   ci/default-values.yaml (namespace kube-system), pushes both this file and the
#   render through tests/golden/normalize.sh, and fails on ANY surviving difference.
#
# TOLERATED DIFFERENCE #1 — cosmetic labels (reconciled, not a bug):
#   The chart adds four standard Helm/Kubernetes recommended labels to EVERY
#   resource's top-level .metadata.labels:
#       app.kubernetes.io/name         (= chart name)
#       app.kubernetes.io/instance     (= release name)
#       app.kubernetes.io/managed-by   (= "Helm")
#       helm.sh/chart                  (= "<chart>-<version>")
#   Rather than pollute this pristine manifest with those cosmetic labels on all
#   13 resources, normalize.sh STRIPS exactly those four keys from .metadata.labels
#   before diffing (and drops the labels map if that empties it). Every resource
#   in the shipped manifest therefore reconciles against the render:
#       CSIDriver/com.hammerspace.csi                              (+4 cosmetic labels)
#       Service/csi-provisioner                                    (+4 cosmetic labels; keeps app: csi-provisioner)
#       StatefulSet/csi-provisioner                                (+4 cosmetic labels)
#       ServiceAccount/csi-provisioner                             (+4 cosmetic labels)
#       ClusterRole/csi-provisioner                                (+4 cosmetic labels)
#       ClusterRoleBinding/csi-provisioner                         (+4 cosmetic labels)
#       ClusterRole/csi-provisioner-snapshot-content-status        (+4 cosmetic labels)
#       ClusterRoleBinding/csi-provisioner-snapshot-content-status-binding (+4 cosmetic labels)
#       DaemonSet/csi-node                                         (+4 cosmetic labels)
#       ServiceAccount/csi-node                                    (+4 cosmetic labels)
#       ClusterRole/csi-node                                       (+4 cosmetic labels)
#       ClusterRoleBinding/csi-node                                (+4 cosmetic labels)
#       ConfigMap/csi-env-config                                   (+4 cosmetic labels)
#
# NO OTHER DIFFERENCE. This is a verbatim copy with no resource added or removed.
#   History: through v1.2.x the manifest carried a dead no-op
#   csi-provisioner-volumeattachment-status-binding (roleRef to a ClusterRole
#   defined nowhere). The chart originally dropped it (Task 12 adversarial
#   review). The v1.3.0 manifest instead REPURPOSED it into the functional
#   ClusterRole/ClusterRoleBinding csi-provisioner-snapshot-content-status
#   (volumesnapshotcontents/status for the snapshotter sidecar), which the chart
#   now renders — so the two sides match verbatim again, with no removed resource.
#   See tests/ADVERSARIAL-REVIEW.md and templates/rbac-controller.yaml.
#
#   Functional labels/selectors (app: csi-provisioner on the Service metadata +
#   selector, app: csi-node, all matchLabels and pod-template labels) and the
#   LOG_LEVEL env added in v1.3.0 are preserved verbatim and are NOT stripped, so
