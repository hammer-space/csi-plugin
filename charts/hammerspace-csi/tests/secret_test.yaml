suite: secret
templates:
  - templates/secret.yaml
tests:
  - it: renders no secret by default (uses existingSecret)
    set:
      hammerspace.endpoint: https://x
    asserts:
      - hasDocuments:
          count: 0
  - it: renders a secret when create=true
    set:
      hammerspace.endpoint: https://x
      hammerspace.secret.create: true
      hammerspace.secret.username: u
      hammerspace.secret.password: p
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Secret
      - equal:
          path: stringData.endpoint
          value: https://x
